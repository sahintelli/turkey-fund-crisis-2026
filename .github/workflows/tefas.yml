name: tefas-collect
on:
  push:
    branches: [tefas-data]
    paths: ["tools/tefas_collect.py", "tools/tefas_probe.py", ".github/workflows/tefas.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - name: Probe TEFAS API
        id: probe
        continue-on-error: true
        run: |
          mkdir -p tefas_out
          python tools/tefas_probe.py tefas_out/probe.txt
      - name: Collect 2025-01-01..2026-09-30
        if: steps.probe.outcome == 'success'
        continue-on-error: true
        run: |
          python -u tools/tefas_collect.py --out tefas_out 2>&1 | tee tefas_out/collect_log.txt
          if ls tefas_out/raw/*.json >/dev/null 2>&1; then gzip -9 tefas_out/raw/*.json; fi
          du -sh tefas_out tefas_out/* | tee -a tefas_out/collect_log.txt
      - name: Commit results to this branch
        if: always()
        run: |
          echo "run_id=${{ github.run_id }} sha=${{ github.sha }} utc=$(date -u +%FT%TZ) runner_ip=$(curl -s https://api.ipify.org || echo n/a)" > tefas_out/run_info.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tefas_out
          git commit -m "TEFAS data run ${{ github.run_id }} [skip ci]" || echo "nothing to commit"
          git push
